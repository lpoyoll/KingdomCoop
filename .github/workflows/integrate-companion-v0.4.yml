name: Integrate and build Companion Co-op v0.4

on:
  push:
    branches:
      - companion-coop/v0.4
    paths:
      - '.kingdomcoop/v0.4-b64/**'
      - '.github/workflows/integrate-companion-v0.4.yml'

permissions:
  contents: write

env:
  OVERLAY_SHA256: a4154fadb892d3547babfb007c17f69776f539bdc2a9bca2a7129388f9283e9b
  OVERLAY_BYTES: 54121

jobs:
  integrate-and-build:
    if: github.event.head_commit.message != 'Integrate Companion Co-op v0.4 source'
    runs-on: windows-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify Companion Co-op source package
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.kingdomcoop\v0.4-b64\part-*.txt' | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 payload chunks, found $($parts.Count)." }

          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          Write-Host "Base64 chars: $($b64.Length)"
          if ($b64.Length -ne 72164) { throw "Base64 length mismatch: expected 72164, got $($b64.Length)" }

          $bytes = [Convert]::FromBase64String($b64)
          $zip = Join-Path $env:RUNNER_TEMP 'KingdomCoop-v0.4-source-overlay.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)

          $item = Get-Item $zip
          Write-Host "Overlay bytes: $($item.Length)"
          if ($item.Length -ne [int64]$env:OVERLAY_BYTES) {
            throw "Overlay byte length mismatch: expected $env:OVERLAY_BYTES, got $($item.Length)"
          }
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Overlay SHA256: $hash"
          if ($hash -ne $env:OVERLAY_SHA256) {
            throw "Overlay SHA256 mismatch: expected $env:OVERLAY_SHA256, got $hash"
          }

          $dest = Join-Path $env:RUNNER_TEMP 'kingdomcoop-v04'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          & tar -xf $zip -C $dest
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }

          $pack = Get-ChildItem $dest -Directory | Select-Object -First 1
          if (-not $pack) { throw 'Source package root not found after extraction.' }
          if (-not (Test-Path (Join-Path $pack.FullName 'APPLY-v0.4.ps1'))) {
            throw "APPLY-v0.4.ps1 missing from extracted package root $($pack.FullName)"
          }
          "KINGDOMCOOP_PACK=$($pack.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rebase verified package guard to upstream 0.17.1
        shell: pwsh
        run: |
          # Upstream 8e2cede changed VERSION and the generated kdcmp.pak only.
          # The source anchors used by APPLY-v0.4.ps1 are unchanged.
          $apply = Join-Path $env:KINGDOMCOOP_PACK 'APPLY-v0.4.ps1'
          $text = [IO.File]::ReadAllText($apply)
          if (-not $text.Contains('upstream 0.17.0')) {
            throw 'Expected the verified 0.17.0 package guard before rebasing.'
          }
          $text = $text.Replace('0.17.0', '0.17.1')
          $text = $text.Replace('kdcmp_party_extension.lua', 'kcdmp_party_extension.lua')

          # Git checkout preserves LF while PowerShell here-strings on the
          # Windows runner use CRLF. Normalise both sides inside Replace-Once
          # so multi-line anchors remain exact and fail closed on real drift.
          $replaceNeedle = '    $s = Read-Utf8 $p'
          $replaceNormalised = @(
            '    $s = (Read-Utf8 $p).Replace("`r`n","`n")'
            '    $old = $old.Replace("`r`n","`n")'
            '    $new = $new.Replace("`r`n","`n")'
          ) -join [Environment]::NewLine
          if (-not $text.Contains($replaceNeedle)) {
            throw 'Could not locate Replace-Once source normalisation point.'
          }
          $text = $text.Replace($replaceNeedle, $replaceNormalised.TrimEnd())

          # The package prepends the v0.4 feature layer before the v0.3
          # foundation it extends. Move the complete layer after the foundation:
          # transport methods, partial classes, the companion session and
          # $luaPath must exist before party/state hooks are applied.
          $featureStart = $text.IndexOf('# ClientConfig is split so companion identity/settings can evolve independently.')
          $featureEnd = $text.IndexOf('# Protocol: partial extension + hard compatibility boundary.', $featureStart)
          $brandingStart = $text.IndexOf('# Branding + fork release version.')
          if ($featureStart -lt 0 -or $featureEnd -le $featureStart -or $brandingStart -lt 0) {
            throw 'Could not locate the verified foundation/feature integration blocks.'
          }
          $featureBlock = $text.Substring($featureStart, $featureEnd - $featureStart)
          $text = $text.Remove($featureStart, $featureEnd - $featureStart)
          $brandingStart = $text.IndexOf('# Branding + fork release version.')
          $text = $text.Insert($brandingStart, $featureBlock + [Environment]::NewLine)

          [IO.File]::WriteAllText($apply, $text, [Text.UTF8Encoding]::new($false))

          $metadata = Join-Path $env:KINGDOMCOOP_PACK 'BUILD-METADATA.json'
          $json = [IO.File]::ReadAllText($metadata).Replace('"base_version": "0.17.0"', '"base_version": "0.17.1"')
          [IO.File]::WriteAllText($metadata, $json, [Text.UTF8Encoding]::new($false))

      - name: Apply all Companion Co-op systems
        shell: pwsh
        run: |
          & "$env:KINGDOMCOOP_PACK\APPLY-v0.4.ps1" -RepoPath $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit integrated source
        shell: pwsh
        run: |
          git config user.name "KingdomCoop CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Integrate Companion Co-op v0.4 source"
            git push origin HEAD:companion-coop/v0.4
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer and direct-install package
        shell: pwsh
        run: |
          & "$env:KINGDOMCOOP_PACK\BUILD-v0.4.ps1" -RepoPath $env:GITHUB_WORKSPACE -SkipApply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KingdomCoop-v0.4-build-output
          path: |
            release/*.exe
            release/*.zip
            release/KCDMP/**
          if-no-files-found: warn
